# Xenoblade 2 Team Helper — static files under /xb2/
#
# Build:  pnpm build
# Copy:   dist/  ->  /var/www/xb2/
#
# Include this file from a server block, e.g.:
#   include /etc/nginx/snippets/xb2.conf;

location = /xb2 {
    return 301 /xb2/;
}

location /xb2/ {
    alias /var/www/xb2/;
    index index.html;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/html text/css application/javascript application/wasm application/octet-stream;

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|data)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
