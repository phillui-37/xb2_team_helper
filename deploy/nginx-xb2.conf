# Xenoblade 2 Team Helper — static files under /xb2/
#
# Build:  pnpm build
# Copy:   dist/  ->  /var/www/xb2/
#
# Include this file from a server block, e.g.:
#   include /etc/nginx/snippets/xb2.conf;

location = /xb2 {
    return 301 /xb2/;
}

# Service worker and web manifest must revalidate so PWA updates are picked up.
location = /xb2/sw.js {
    alias /var/www/xb2/sw.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
}

location = /xb2/manifest.webmanifest {
    alias /var/www/xb2/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

location /xb2/ {
    alias /var/www/xb2/;
    index index.html;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/html text/css application/javascript application/manifest+json;

    location ~* \.(?:js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache";
    }
}
